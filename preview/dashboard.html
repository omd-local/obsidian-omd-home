<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OMD Home visual fixture</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main class="omd-home-view">
    <header class="omd-home-header">
      <div class="omd-home-title"><span class="omd-home-mark">OMD</span><h1>Good evening</h1><p>Thursday, 23 July</p></div>
      <button class="icon-button" aria-label="Reset layout">↺</button>
    </header>
    <div class="omd-widget-grid">
      <section class="omd-widget omd-widget-omnibox" style="grid-column:1/span 12;grid-row:1/span 2"><div class="omd-widget-body"><form class="omd-omnibox"><span class="omd-omnibox-icon">⌕</span><input class="omd-omnibox-input" placeholder="Search, capture, command, note, event, or ask OMD"><span class="omd-omnibox-hint">&gt; + @</span></form></div></section>
      <section class="omd-widget" style="grid-column:1/span 5;grid-row:3/span 5"><header class="omd-widget-header"><h2>Today</h2><span>··</span></header><div class="omd-widget-body">
        <button class="omd-event-row"><span class="omd-source-mark is-linked"></span><span class="omd-event-time">09:30</span><span class="omd-event-title">Design review</span></button>
        <button class="omd-event-row"><span class="omd-source-mark is-external"></span><span class="omd-event-time">13:00</span><span class="omd-event-title">Project planning</span></button>
        <button class="omd-event-row"><span class="omd-source-mark"></span><span class="omd-event-time">ALL</span><span class="omd-event-title">Draft weekly note</span></button>
      </div><i class="omd-widget-resize"></i></section>
      <section class="omd-widget" style="grid-column:6/span 4;grid-row:3/span 5"><header class="omd-widget-header"><h2>OMD Inbox</h2><span>··</span></header><div class="omd-widget-body">
        <button class="omd-note-row"><span class="omd-note-title">Review OMD Home architecture</span><span class="omd-note-path">Inbox</span></button>
        <button class="omd-note-row"><span class="omd-note-title">Article on local-first software</span><span class="omd-note-path">Inbox</span></button>
        <button class="omd-note-row"><span class="omd-note-title">Calendar workflows</span><span class="omd-note-path">Inbox</span></button>
      </div><i class="omd-widget-resize"></i></section>
      <section class="omd-widget" style="grid-column:10/span 3;grid-row:3/span 3"><header class="omd-widget-header"><h2>System</h2><span>··</span></header><div class="omd-widget-body"><div class="omd-status-line"><span>OMD</span><span class="omd-status-value">ready</span></div><div class="omd-status-line"><span>Calendar</span><span class="omd-status-value">connected</span></div><div class="omd-status-line"><span>AI</span><span class="omd-status-value">task consent</span></div></div></section>
      <section class="omd-widget" style="grid-column:10/span 3;grid-row:6/span 2"><header class="omd-widget-header"><h2>Active processing</h2><span>··</span></header><div class="omd-widget-body"><div class="omd-empty"><div class="omd-empty-pixel"></div><strong>OMD is idle</strong><span>Paste a URL or file path above.</span></div></div></section>
      <section class="omd-widget" style="grid-column:1/span 4;grid-row:8/span 4"><header class="omd-widget-header"><h2>Continue</h2><span>··</span></header><div class="omd-widget-body"><button class="omd-note-row"><span class="omd-note-title">OMD Home product brief</span><span class="omd-note-path">Projects / OMD Home</span></button><button class="omd-note-row"><span class="omd-note-title">July studio log</span><span class="omd-note-path">Journal</span></button></div></section>
      <section class="omd-widget" style="grid-column:5/span 5;grid-row:8/span 4"><header class="omd-widget-header"><h2>Recent notes</h2><span>··</span></header><div class="omd-widget-body"><button class="omd-note-row"><span class="omd-note-title">Pixel interface references</span><span class="omd-note-path">Design</span></button><button class="omd-note-row"><span class="omd-note-title">Provider adapter notes</span><span class="omd-note-path">Research</span></button><button class="omd-note-row"><span class="omd-note-title">Calendar sync model</span><span class="omd-note-path">Projects / OMD Home</span></button></div></section>
      <section class="omd-widget" style="grid-column:10/span 3;grid-row:8/span 4"><header class="omd-widget-header"><h2>Needs attention</h2><span>··</span></header><div class="omd-widget-body"><div class="omd-empty"><div class="omd-empty-pixel"></div><strong>Nothing needs attention</strong><span>Sync and processing are healthy.</span></div></div></section>
    </div>
  </main>
</body>
</html>
