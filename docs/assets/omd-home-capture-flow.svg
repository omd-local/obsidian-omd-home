<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title-capture desc-capture" shape-rendering="crispEdges">
  <title id="title-capture">OMD Home // Capture, Then Review</title>
  <desc id="desc-capture">A pixel-styled capture flow showing a URL or file entering OMD Home, running through OMD, producing Markdown and trace files, and optionally generating review-first proposals.</desc>
  <defs>
    <pattern id="grid-capture" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8064F4" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow-capture" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#202124"/>
  <rect width="1600" height="900" fill="url(#grid-capture)"/>
  <rect x="62" y="52" width="1496" height="796" fill="#202124" opacity="0.34"/>
  <rect x="44" y="36" width="1496" height="796" fill="#F4F1E8" stroke="#202124" stroke-width="6"/>
  <rect x="44" y="36" width="1496" height="84" fill="#8064F4" stroke="#202124" stroke-width="6"/>
  <text x="74" y="88" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#F4F1E8">CAPTURE // KEEP IT TRACEABLE</text>
  <text x="1496" y="88" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#F4F1E8">OMD PIPELINE</text>

  <rect x="84" y="150" width="1430" height="126" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="150" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="182" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">1  SUBMIT ONE SOURCE</text>
  <rect x="108" y="214" width="312" height="40" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="442" y="214" width="312" height="40" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="776" y="214" width="312" height="40" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="1110" y="214" width="378" height="40" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="264" y="239" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">PASTE URL</text>
  <text x="598" y="239" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">PASTE LOCAL PATH</text>
  <text x="932" y="239" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">DROP FILE</text>
  <text x="1299" y="239" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F4F1E8">NORMALISE TILDES AND SPACES</text>

  <line x1="800" y1="276" x2="800" y2="308" stroke="#202124" stroke-width="6" marker-end="url(#arrow-capture)"/>

  <rect x="84" y="320" width="1430" height="126" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="320" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="352" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">2  HAND OFF THE SUBMITTED SOURCE</text>
  <text x="108" y="402" font-family="Courier New, monospace" font-size="18" fill="#202124">Pass the single public URL or local file to OMD; OMD reports conversion progress and failures.</text>

  <line x1="800" y1="446" x2="800" y2="478" stroke="#202124" stroke-width="6" marker-end="url(#arrow-capture)"/>

  <rect x="84" y="490" width="1430" height="156" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="490" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="522" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">3  RUN OMD AND SAVE RAW OUTPUT</text>
  <rect x="108" y="560" width="420" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="588" y="560" width="420" height="56" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <rect x="1068" y="560" width="420" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="318" y="594" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">MANAGED OMD PROCESS</text>
  <text x="798" y="594" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F4F1E8">READABLE .MD PLUS .OMD.JSON TRACE</text>
  <text x="1278" y="594" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">BACKGROUND WORK STAYS VISIBLE</text>

  <line x1="800" y1="646" x2="800" y2="678" stroke="#202124" stroke-width="6" marker-end="url(#arrow-capture)"/>

  <rect x="84" y="690" width="696" height="120" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="818" y="690" width="696" height="120" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="730" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">4  OPTIONAL LOCAL POLISH</text>
  <text x="108" y="762" font-family="Courier New, monospace" font-size="17" fill="#202124">Generate link and tag proposals only.</text>
  <text x="108" y="786" font-family="Courier New, monospace" font-size="17" fill="#202124">Nothing writes until the user applies.</text>
  <text x="842" y="730" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">5  REVIEW BEFORE APPLY</text>
  <text x="842" y="762" font-family="Courier New, monospace" font-size="17" fill="#202124">User reviews proposals and applies</text>
  <text x="842" y="786" font-family="Courier New, monospace" font-size="17" fill="#202124">explicit changes into the vault.</text>
</svg>
