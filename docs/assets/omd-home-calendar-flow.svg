<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title-calendar desc-calendar" shape-rendering="crispEdges">
  <title id="title-calendar">OMD Home // Calendar Sync, No Silent Winner</title>
  <desc id="desc-calendar">A pixel-styled calendar flow showing live filters, event creation modes, selected EventKit calendars, and explicit conflict handling.</desc>
  <defs>
    <pattern id="grid-calendar" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8064F4" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow-calendar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#202124"/>
  <rect width="1600" height="900" fill="url(#grid-calendar)"/>
  <rect x="62" y="52" width="1496" height="796" fill="#202124" opacity="0.34"/>
  <rect x="44" y="36" width="1496" height="796" fill="#F4F1E8" stroke="#202124" stroke-width="6"/>
  <rect x="44" y="36" width="1496" height="84" fill="#8064F4" stroke="#202124" stroke-width="6"/>
  <text x="74" y="88" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#F4F1E8">CALENDAR SYNC // NO SILENT WINNER</text>
  <text x="1496" y="88" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#F4F1E8">MACOS EVENTKIT</text>

  <rect x="84" y="152" width="1430" height="108" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="108" y="182" width="182" height="42" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="310" y="182" width="202" height="42" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="532" y="182" width="182" height="42" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="1230" y="174" width="258" height="50" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="199" y="208" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">VAULT</text>
  <text x="411" y="208" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">CALENDAR</text>
  <text x="623" y="208" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">LINKED</text>
  <text x="1359" y="206" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#F4F1E8">FILTERS PLUS NEW EVENT</text>

  <line x1="800" y1="260" x2="800" y2="292" stroke="#202124" stroke-width="6" marker-end="url(#arrow-calendar)"/>

  <rect x="84" y="306" width="1430" height="154" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="306" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="338" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">CREATE EVENT</text>
  <rect x="108" y="378" width="610" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="880" y="378" width="610" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="138" y="412" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">VAULT NOTE ONLY</text>
  <text x="910" y="412" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">VAULT PLUS DEFAULT CALENDAR</text>
  <text x="108" y="452" font-family="Courier New, monospace" font-size="17" fill="#202124">Start and End use local date-time controls. All-day end stays exclusive.</text>

  <line x1="800" y1="460" x2="800" y2="492" stroke="#202124" stroke-width="6" marker-end="url(#arrow-calendar)"/>

  <rect x="84" y="504" width="1430" height="162" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="504" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="536" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">COMPARE LINKED VERSIONS</text>
  <rect x="112" y="574" width="372" height="60" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="614" y="574" width="270" height="60" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <rect x="1014" y="574" width="476" height="60" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="298" y="611" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">MARKDOWN EVENT NOTE</text>
  <text x="749" y="611" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F4F1E8">COMPARE</text>
  <text x="1252" y="611" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">SELECTED CALENDAR EVENT</text>
  <line x1="484" y1="604" x2="614" y2="604" stroke="#202124" stroke-width="6" marker-end="url(#arrow-calendar)"/>
  <line x1="884" y1="604" x2="1014" y2="604" stroke="#202124" stroke-width="6" marker-end="url(#arrow-calendar)"/>

  <line x1="800" y1="666" x2="800" y2="698" stroke="#202124" stroke-width="6" marker-end="url(#arrow-calendar)"/>

  <rect x="84" y="710" width="690" height="110" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="824" y="710" width="690" height="110" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="110" y="752" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#202124">ONE SIDE CHANGED</text>
  <text x="110" y="786" font-family="Courier New, monospace" font-size="17" fill="#202124">Safe update from the changed side into the linked copy.</text>
  <text x="850" y="752" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#202124">BOTH SIDES CHANGED</text>
  <text x="850" y="786" font-family="Courier New, monospace" font-size="17" fill="#202124">Conflict choice: keep Markdown or keep Calendar.</text>

  <rect x="412" y="826" width="776" height="36" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="800" y="848" text-anchor="middle" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#F4F1E8">SELECTED CALENDARS ONLY  /  ICLOUD, GOOGLE, AND OUTLOOK COME THROUGH CALENDAR.APP</text>
</svg>
