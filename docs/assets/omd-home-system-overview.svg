  <rect x="428" y="158" width="484" height="48" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="452" y="190" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">OMNIBOX</text>
  <text x="452" y="238" font-family="Courier New, monospace" font-size="18" fill="#202124">Vault search, commands, quick notes,</text>
  <text x="452" y="264" font-family="Courier New, monospace" font-size="18" fill="#202124">capture, events, and read-only ask.</text>
  <rect x="452" y="286" width="222" height="22" fill="#8064F4"/>
  <text x="684" y="302" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#202124">ONE INPUT, MANY ACTIONS</text>

