<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title-system desc-system" shape-rendering="crispEdges">
  <title id="title-system">OMD Home // One Door, Four Surfaces</title>
  <desc id="desc-system">A pixel-styled system overview showing the OMD Home doorway, four core surfaces, and the local tools they coordinate.</desc>
  <defs>
    <pattern id="grid-system" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8064F4" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow-system" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#202124"/>
