  <rect x="692" y="648" width="218" height="66" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="932" y="648" width="218" height="66" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="1172" y="648" width="260" height="66" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="561" y="688" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">VAULT</text>
  <text x="801" y="688" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">OMD</text>
  <text x="1041" y="688" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">OLLAMA</text>
  <text x="1302" y="688" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">EVENTKIT HELPER</text>
  <text x="452" y="728" font-family="Courier New, monospace" font-size="16" fill="#202124">Layouts stay per device. The vault stays primary.</text>
  <text x="452" y="752" font-family="Courier New, monospace" font-size="16" fill="#202124">Local tools add capture, AI, and sync without replacing it.</text>
</svg>
