  <text x="452" y="446" font-family="Courier New, monospace" font-size="18" fill="#202124">Recent captures, review-first tags,</text>
  <text x="452" y="472" font-family="Courier New, monospace" font-size="18" fill="#202124">links, retries, and timestamps.</text>
  <rect x="452" y="494" width="244" height="22" fill="#8064F4"/>
  <text x="706" y="510" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#202124">PROPOSE, THEN APPLY</text>

  <rect x="972" y="366" width="484" height="176" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="972" y="366" width="484" height="48" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="996" y="398" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">STATUS</text>
  <text x="996" y="446" font-family="Courier New, monospace" font-size="18" fill="#202124">Active processing keeps running.</text>
  <text x="996" y="472" font-family="Courier New, monospace" font-size="18" fill="#202124">Needs attention keeps failures visible.</text>
  <rect x="996" y="494" width="226" height="22" fill="#8064F4"/>
  <text x="1232" y="510" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#202124">NOTHING FAILS SILENTLY</text>

  <rect x="428" y="574" width="1028" height="174" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="428" y="574" width="1028" height="48" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="452" y="606" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">LOCAL BOUNDARIES</text>

