  <path d="M148 294H316V626H148Z" fill="#F4F1E8" stroke="#202124" stroke-width="8"/>
  <path d="M148 294H244V222H316V294" fill="none" stroke="#202124" stroke-width="8"/>
  <path d="M238 590H290V374H258V338H206V374H184V590H238Z" fill="#8064F4" stroke="#202124" stroke-width="8"/>
  <path d="M194 590V394H242L206 358H158V590" fill="#202124" stroke="#202124" stroke-width="8"/>
  <rect x="192" y="468" width="18" height="18" fill="#F4F1E8"/>
  <text x="108" y="678" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">ONE ENTRANCE</text>
  <text x="108" y="708" font-family="Courier New, monospace" font-size="17" fill="#202124">Capture, calendars, review, and</text>
  <text x="108" y="734" font-family="Courier New, monospace" font-size="17" fill="#202124">vault Q and A share one front door.</text>

