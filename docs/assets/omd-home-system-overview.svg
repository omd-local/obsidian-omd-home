  <text x="996" y="238" font-family="Courier New, monospace" font-size="18" fill="#202124">Markdown events plus selected</text>
  <text x="996" y="264" font-family="Courier New, monospace" font-size="18" fill="#202124">EventKit calendars with conflict review.</text>
  <rect x="996" y="286" width="252" height="22" fill="#8064F4"/>
  <text x="1258" y="302" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#202124">NO SILENT WINNER</text>

