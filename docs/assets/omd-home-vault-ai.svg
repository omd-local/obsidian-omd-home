  <text x="800" y="447" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#8064F4">EVIDENCE ONLY</text>

  <rect x="80" y="470" width="1440" height="218" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="104" y="512" width="348" height="126" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="626" y="512" width="348" height="126" fill="#8064F4" stroke="#202124" stroke-width="3"/>
  <rect x="1148" y="496" width="348" height="158" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <text x="278" y="557" text-anchor="middle" font-family="Courier New, monospace" font-size="21" font-weight="700" fill="#8064F4">BOUNDED EVIDENCE</text>
  <text x="278" y="591" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#202124">Ranked notes and source blocks</text>
  <text x="800" y="557" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#F4F1E8">LOCAL OLLAMA</text>
  <text x="800" y="591" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#F4F1E8">Answer only from supplied context</text>
  <text x="1322" y="535" text-anchor="middle" font-family="Courier New, monospace" font-size="21" font-weight="700" fill="#8064F4">RESULT PANEL</text>
  <text x="1322" y="568" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#202124">ANSWER / SOURCES / MODE</text>
  <text x="1322" y="597" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#202124">ELAPSED TIME / COPY RESULT</text>
  <line x1="452" y1="575" x2="626" y2="575" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="974" y1="575" x2="1148" y2="575" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="720" width="920" height="154" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="104" y="756" font-family="Courier New, monospace" font-size="21" font-weight="700" fill="#202124">LOCAL-ONLY GATE</text>
  <rect x="104" y="784" width="260" height="58" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="402" y="784" width="260" height="58" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="700" y="784" width="260" height="58" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <text x="234" y="821" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#202124">LOOPBACK ENDPOINT</text>
  <text x="532" y="821" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#202124">MODEL INSTALLED</text>
  <text x="830" y="821" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#202124">CLOUD DISABLED</text>

  <rect x="1030" y="720" width="490" height="154" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="1275" y="770" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#8064F4">NO AUTOMATIC VAULT WRITE</text>
  <text x="1275" y="810" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#202124">Vault Q&amp;A stays read-only.</text>
  <text x="1275" y="840" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#202124">Copy only when you choose.</text>

  <rect x="80" y="900" width="1440" height="42" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="800" y="929" text-anchor="middle" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#F4F1E8">LOCAL EVIDENCE IN // ANSWER OUT // VAULT UNCHANGED</text>
</svg>
