<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">OMD Home // Ask the Vault, See the Evidence</title>
  <desc id="desc">Read-only vault question flow showing retrieval of bounded vault evidence before a local Ollama model returns an answer, sources, retrieval mode, and elapsed time.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8064F4" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#202124"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="#202124"/>
  <rect width="1600" height="980" fill="url(#grid)" opacity="0.8"/>
  <rect x="42" y="38" width="1516" height="904" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="42" y="38" width="1516" height="82" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="76" y="89" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#F4F1E8">ASK THE VAULT // SEE THE EVIDENCE</text>
  <text x="1504" y="89" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#F4F1E8">PHASE 1A LOCAL AI</text>
  <path d="M1516 55H1536L1546 65V101H1516Z" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <path d="M1536 55V65H1546" fill="none" stroke="#202124" stroke-width="3"/>
  <path d="M1522 95V75H1538V95H1542V99H1519V95Z" fill="#202124"/>
  <rect x="1526" y="83" width="4" height="4" fill="#F4F1E8"/>

  <rect x="80" y="150" width="1440" height="260" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="80" y="150" width="1440" height="48" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="104" y="182" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">RETRIEVE BEFORE ANSWERING</text>
  <rect x="104" y="242" width="224" height="106" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="390" y="242" width="224" height="106" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="676" y="242" width="224" height="106" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="962" y="242" width="224" height="106" fill="#F4F1E8" stroke="#202124" stroke-width="3"/>
  <rect x="1248" y="242" width="224" height="106" fill="#8064F4" stroke="#202124" stroke-width="3"/>
  <text x="216" y="304" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">@ QUESTION</text>
  <text x="502" y="304" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">OMD HOME</text>
  <text x="788" y="289" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">BUNDLED PYTHON</text>
  <text x="788" y="317" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">BRIDGE</text>
  <text x="1074" y="289" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#202124">OMD</text>
  <text x="1074" y="317" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#202124">RETRIEVAL</text>
  <text x="1360" y="289" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#F4F1E8">VAULT</text>
  <text x="1360" y="317" text-anchor="middle" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#F4F1E8">EVIDENCE</text>
  <line x1="328" y1="295" x2="390" y2="295" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="614" y1="295" x2="676" y2="295" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="900" y1="295" x2="962" y2="295" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1186" y1="295" x2="1248" y2="295" stroke="#202124" stroke-width="5" marker-end="url(#arrow)"/>

