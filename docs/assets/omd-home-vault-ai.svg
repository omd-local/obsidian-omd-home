<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title-ai desc-ai" shape-rendering="crispEdges">
  <title id="title-ai">OMD Home // Ask the Vault, See the Evidence</title>
  <desc id="desc-ai">A pixel-styled local AI flow showing the omnibox question, bridge, retrieval, local Ollama, and the evidence-backed result panel.</desc>
  <defs>
    <pattern id="grid-ai" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8064F4" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow-ai" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#202124"/>
  <rect width="1600" height="900" fill="url(#grid-ai)"/>
  <rect x="62" y="52" width="1496" height="796" fill="#202124" opacity="0.34"/>
  <rect x="44" y="36" width="1496" height="796" fill="#F4F1E8" stroke="#202124" stroke-width="6"/>
  <rect x="44" y="36" width="1496" height="84" fill="#8064F4" stroke="#202124" stroke-width="6"/>
  <text x="74" y="88" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#F4F1E8">ASK THE VAULT // SEE THE EVIDENCE</text>
  <text x="1496" y="88" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700" fill="#F4F1E8">PHASE 1A LOCAL AI</text>

  <rect x="84" y="150" width="1430" height="172" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="108" y="206" width="222" height="62" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="398" y="206" width="222" height="62" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="688" y="206" width="222" height="62" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="978" y="206" width="222" height="62" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="1268" y="206" width="222" height="62" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="219" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">AT QUESTION</text>
  <text x="509" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">OMD HOME</text>
  <text x="799" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">PYTHON BRIDGE</text>
  <text x="1089" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">OMD RETRIEVAL</text>
  <text x="1379" y="244" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F4F1E8">LOCAL OLLAMA</text>
  <line x1="330" y1="237" x2="398" y2="237" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>
  <line x1="620" y1="237" x2="688" y2="237" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>
  <line x1="910" y1="237" x2="978" y2="237" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>
  <line x1="1200" y1="237" x2="1268" y2="237" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>
  <text x="108" y="304" font-family="Courier New, monospace" font-size="18" fill="#202124">Question in, bounded evidence out. No automatic vault write.</text>

  <line x1="800" y1="322" x2="800" y2="354" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>

  <rect x="84" y="368" width="952" height="210" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="1082" y="368" width="432" height="210" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="408" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">RESULT PANEL</text>
  <text x="108" y="448" font-family="Courier New, monospace" font-size="18" fill="#202124">Answer, source chips, retrieval mode, elapsed time, and Copy result.</text>
  <rect x="108" y="486" width="720" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <text x="132" y="515" font-family="Courier New, monospace" font-size="17" fill="#202124">EVIDENCE CHIPS  /  BOUNDED SOURCE BLOCKS  /  RESULT TIMER</text>

  <text x="1108" y="408" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">LOCAL GATE</text>
  <text x="1108" y="448" font-family="Courier New, monospace" font-size="18" fill="#202124">Accepted loopback endpoint only.</text>
  <text x="1108" y="474" font-family="Courier New, monospace" font-size="18" fill="#202124">Selected model must exist locally.</text>
  <text x="1108" y="500" font-family="Courier New, monospace" font-size="17" fill="#202124">Cloud-disabled mode required before</text>
  <text x="1108" y="524" font-family="Courier New, monospace" font-size="17" fill="#202124">vault content can be sent.</text>

  <line x1="800" y1="578" x2="800" y2="610" stroke="#202124" stroke-width="6" marker-end="url(#arrow-ai)"/>

  <rect x="84" y="624" width="1430" height="190" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <rect x="84" y="624" width="1430" height="46" fill="#F4F1E8" stroke="#202124" stroke-width="5"/>
  <text x="108" y="656" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#202124">READINESS COMMANDS</text>
  <rect x="108" y="702" width="404" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="596" y="702" width="404" height="56" fill="#F4F1E8" stroke="#202124" stroke-width="4"/>
  <rect x="1084" y="702" width="404" height="56" fill="#8064F4" stroke="#202124" stroke-width="4"/>
  <text x="310" y="737" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">REFRESH MODELS</text>
  <text x="798" y="737" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#202124">CHECK CONNECTION</text>
  <text x="1286" y="737" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F4F1E8">SMOKE WITHOUT VAULT CONTENT</text>
  <text x="108" y="790" font-family="Courier New, monospace" font-size="16" fill="#202124">Hybrid retrieval can add embeddings and reranking. Sparse fallback stays explicit when semantic recall is unavailable.</text>
</svg>
